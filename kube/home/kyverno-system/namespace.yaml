---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kyverno-admission-controller
  namespace: kyverno-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-cleanup-placeholder
  namespace: kyverno-system
  labels:
    app.kubernetes.io/part-of: kyverno
spec:
  replicas: 0
  selector:
    matchLabels:
      app: kyverno-cleanup-placeholder
  template:
    metadata:
      labels:
        app: kyverno-cleanup-placeholder
    spec:
      containers:
        - name: placeholder
          image: registry.k8s.io/pause:3.10
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cleanup-placeholder
  namespace: kyverno-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["kyverno-cleanup-placeholder"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-cleanup-placeholder
  namespace: kyverno-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-cleanup-placeholder
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno-system
