---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argo-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.7.2
    helm:
      releaseName: kyverno
      valuesObject:
        features:
          # Force all admission webhooks to failurePolicy: Ignore.
          # Prevents the cluster-wide deadlock where a down Kyverno webhook
          # (no endpoints) blocks all pod creation. See INC-0008/INC-0009.
          forceFailurePolicyIgnore:
            enabled: true
  destination:
    name: in-cluster
    namespace: kyverno-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
