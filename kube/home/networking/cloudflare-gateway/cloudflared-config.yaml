---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cianfr-one-tunnel-config
  namespace: networking
data:
  replicas: "2"
  resources: |
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                cfargotunnel.com/name: cianfr-one-tunnel
