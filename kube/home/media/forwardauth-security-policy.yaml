---
# Protect the media management routes with Authelia before forwarding requests.
# Authelia access-control rules determine which users can access these routes.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: forwardauth-security-policy
  namespace: media
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: sonarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: radarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: lidarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: prowlarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: bazarr }
  extAuth:
    failOpen: false
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    http:
      backendRefs:
        - name: authelia
          namespace: auth
          port: 80
      path: /api/authz/ext-authz/
