---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cliproxyapi
  namespace: argo-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bjw-s-labs.github.io/helm-charts
    chart: app-template
    targetRevision: 5.1.0
    helm:
      releaseName: cliproxyapi
      valuesObject:
        defaultPodOptions:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

        controllers:
          main:
            type: deployment
            replicas: 1
            strategy: Recreate
            annotations:
              reloader.stakater.com/auto: "true"
            containers:
              main:
                image:
                  repository: eceasy/cli-proxy-api
                  tag: v8.0.15@sha256:ebc2ffc189cf241ff589cd9237c63ca9feba3c9b87fe6213ab9a0b642df132ae
                command:
                  - /CLIProxyAPI/CLIProxyAPI
                args:
                  - --config
                  - /config/config.yaml
                env:
                  TZ: Europe/Amsterdam
                  HOME: /data
                probes:
                  liveness: &probe
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8317
                      periodSeconds: 10
                      timeoutSeconds: 1
                  readiness: *probe
                  startup:
                    enabled: true
                    custom: true
                    spec:
                      tcpSocket:
                        port: 8317
                      periodSeconds: 5
                      failureThreshold: 30
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]

        service:
          main:
            controller: main
            type: ClusterIP
            ports:
              http:
                port: 8317

        persistence:
          data:
            type: persistentVolumeClaim
            existingClaim: cliproxyapi-data
            globalMounts:
              - path: /data
          config:
            type: secret
            name: cliproxyapi-secrets
            globalMounts:
              - path: /config
                readOnly: true
          logs:
            type: emptyDir
            globalMounts:
              - path: /CLIProxyAPI/logs
          tmp:
            type: emptyDir
            globalMounts:
              - path: /tmp
  destination:
    name: in-cluster
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
